name: FlowCreator OS CI / CD Verification

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  backend-checks:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest fastapi pydantic uvicorn python-multipart Pillow requests boto3

      - name: Python Syntax & Lint Check
        run: |
          # Verify clean Python compilation
          python -m py_compile backend/main.py backend/caption_engine.py backend/bulk_upload_r2.py
          # Flake8 style report (informational)
          flake8 backend --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

  frontend-checks:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install --legacy-peer-deps

      - name: Typecheck & Build Next.js
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: "https://01talha-arqa-chatbot.hf.space"
        run: npm run build
