name: Build Android APK (Capacitor)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci || npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android --save

      - name: Build Next.js Production App
        working-directory: frontend
        run: |
          npm run build

      - name: Initialize Capacitor Android Project
        working-directory: frontend
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android Debug APK with Gradle
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowCreator-Studio-Android-APK
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
