name: Build Android APK (Capacitor)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configure Android SDK Environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci || npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android --save

      - name: Build Next.js Production App
        working-directory: frontend
        run: |
          npm run build

      - name: Initialize Capacitor Android Project
        working-directory: frontend
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android Debug APK with Gradle
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Distribution
        run: |
          mkdir -p dist-apk
          cp frontend/android/app/build/outputs/apk/debug/*.apk dist-apk/FlowCreator-Studio.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowCreator-Studio-Android-APK
          path: dist-apk/FlowCreator-Studio.apk
          retention-days: 30

      - name: Publish Direct Release APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: "FlowCreator Studio Pro - Android APK (v1.0.0)"
          body: |
            ## 📱 FlowCreator Studio Pro Mobile (Android APK)
            1-Click CapCut-style AI Reels & Captions creation for Android smartphones.
            
            ### 📥 Download & Install:
            Download **`FlowCreator-Studio.apk`** below and tap to install on your Android device.
          files: dist-apk/FlowCreator-Studio.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
